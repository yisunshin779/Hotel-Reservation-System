server {
  listen 80;
  root /usr/share/nginx/html;

  # Chuyển các yêu cầu /api sang backend (đổi tên và cổng cho khớp backend của nhóm)
  location /api/ {
    proxy_pass http://hotel-backend:8080/api/;
  }

  # Trang React: mọi đường dẫn đều trả về index.html
  location / {
    try_files $uri /index.html;
  }
}
services:
  postgres:
    image: postgres:15-alpine
    container_name: hrs-postgres
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:-}
      POSTGRES_DB: hotel_db
    ports:
      - "127.0.0.1:${HOTEL_DB_HOST_PORT:-5433}:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hrs-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

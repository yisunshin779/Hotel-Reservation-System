spring:
  datasource:
    url: ${HOTEL_DB_URL}
    username: ${HOTEL_DB_USER}
    password: ${HOTEL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
hotel:
  payment:
    # MOCK_QR and MOCK_CARD writes are refused (409 MOCK_PAYMENT_DISABLED); cash and reads stay available.
    mock-methods-enabled: ${HOTEL_PAYMENT_MOCK_ENABLED:false}

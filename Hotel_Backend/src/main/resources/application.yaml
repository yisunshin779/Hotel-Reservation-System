spring:
  flyway:
    enabled: ${HOTEL_FLYWAY_ENABLED:false}
    default-schema: hotel
    schemas: hotel
    baseline-version: "8"
    baseline-on-migrate: false
    clean-disabled: true
  datasource:
    url: ${HOTEL_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/hotel_db}}
    username: ${HOTEL_DB_USER:${DB_USERNAME:hotel_admin}}
    password: ${HOTEL_DB_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HOTEL_DDL_AUTO:none}
    properties:
      hibernate:
        default_schema: hotel
  autoconfigure:
    exclude: org.redisson.spring.starter.RedissonAutoConfigurationV2
  mail:
    host: ${HOTEL_SMTP_HOST:smtp.gmail.com}
    port: ${HOTEL_SMTP_PORT:587}
    username: ${HOTEL_SMTP_USER:}
    password: ${HOTEL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  error:
    include-message: never

google:
  client-id: ${HOTEL_GOOGLE_CLIENT_ID:}

app:
  jwt-secret: ${HOTEL_JWT_SECRET:}
  public-base-url: ${HOTEL_PUBLIC_BASE_URL}
  frontend-base-url: ${HOTEL_FRONTEND_BASE_URL}

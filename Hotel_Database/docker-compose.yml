services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: hotel_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  hotel_pgdata:
